<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کیوآر کد تأیید گواهینامه</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b1d29;--muted:#6b7084;--border:#dfe2ee;--accent:#4f46e5}
@media (prefers-color-scheme:dark){:root{--bg:#14151c;--card:#1d1f2b;--text:#eceef8;--muted:#9a9fb8;--border:#2e3144;--accent:#818cf8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:20px 14px}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
h1{font-size:1.25rem;margin:0 0 16px}
label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;padding:12px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.txt{margin-top:18px;padding:12px;border:1px dashed var(--border);border-radius:10px;font-size:.95rem;line-height:1.9;min-height:3em}
.out{margin-top:16px;display:flex;justify-content:center;padding:0;border:0;background:none}
.out img:not([src]){display:none}
.out img{max-width:100%;height:auto;image-rendering:pixelated}
a.btn{display:block;margin-top:14px;text-align:center;padding:12px;background:var(--accent);color:#fff;border-radius:10px;text-decoration:none;font-weight:bold}
a.btn[hidden]{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>کیوآر کد تأیید گواهینامه</h1>
  <label for="name">نام و نام خانوادگی</label>
  <input id="name" type="text" value="" autocomplete="off" autofocus>
  <label for="code">کد ملی</label>
  <input id="code" type="text" inputmode="numeric" value="" autocomplete="off">
  <label for="type">نوع گواهینامه</label>
  <select id="type">
    <option>پایه سوم</option>
    <option>پایه دوم</option>
    <option>پایه یکم</option>
    <option>موتورسیکلت</option>
    <option>ویژه</option>
  </select>
  <div class="txt" id="preview"></div>
  <div class="out"><img id="img" alt=""></div>
  <a class="btn" id="dl" download="qr-code.png" hidden>دانلود تصویر (PNG)</a>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var nameEl=$('name'),codeEl=$('code'),typeEl=$('type'),prev=$('preview'),img=$('img'),dl=$('dl');
  if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8']){qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];}
  var P='۰۱۲۳۴۵۶۷۸۹';
  function toFa(s){return s.replace(/[0-9]/g,function(d){return P[d]}).replace(/[٠-٩]/g,function(d){return P['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]});}
  function render(){
    var name=nameEl.value.trim(),code=toFa(codeEl.value.trim());
    if(!name||!code){prev.textContent='';img.removeAttribute('src');dl.hidden=true;return;}
    var text=name+' با کد ملی '+code+' گواهینامه '+typeEl.value+' تایید شد.';
    prev.textContent=text;
    var qr=qrcode(0,'M');
    qr.addData(text);
    qr.make();
    var n=qr.getModuleCount(),cell=8,margin=0,size=(n+margin*2)*cell;
    var c=document.createElement('canvas');c.width=c.height=size;
    var g=c.getContext('2d');
    g.fillStyle='#fff';g.fillRect(0,0,size,size);
    g.fillStyle='#000';
    for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(qr.isDark(r,k))g.fillRect((k+margin)*cell,(r+margin)*cell,cell,cell);
    var url=c.toDataURL('image/png');
    img.src=url;dl.href=url;dl.hidden=false;
  }
  [nameEl,codeEl].forEach(function(e){e.addEventListener('input',render)});
  typeEl.addEventListener('change',render);
  render();
})();
</script>
</body>
</html>
